<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The BFWT Website</title>
  <link href='https://fonts.googleapis.com/css?family=Comfortaa' rel='stylesheet'>
  <style>
    html, body {
      margin: 0;
      padding: 0;
    }
    .titleBar {
      width: 100%;
      box-sizing: border-box;
      border-bottom-width: 5px;
      border-bottom-style: outset;
      border-bottom-color: #313131;
      background-color: #BFBFBF;  /* cuz... yk... BF31 = BFWT...??? */
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .titlePlate {
      display: flex;
      flex-direction: column;
      text-align: left;
      font-family: "Times New Roman", Times, serif;
      text-align: left;
      padding: 12px;
      line-height: 1.0;
    }
    .title {
      font-size: 72px;
      & a {
        text-decoration: none;
      }
      & a:hover {
        text-decoration: underline #E1E1E1 solid 4px;
      }
    }
    .subtitle {
      font-size: 16px;
      color: #313131;
    }
    .linksPlatter {
      text-align: right;
      font-size: 16px;
      font-family: Tahoma, sans-serif;
      padding: 0px 16px;
      flex-grow: 1;
      & a {
        color: currentColor;
        text-decoration: underline;
      }
    }
  </style>
</head>
<body>
  <!-- Title bar here -->
  <div class="titleBar">

      <div class="title">

      </div>
      <div class="subtitle">Homepage</div>
    </div>
    <div class="linksPlatter">

    </div>
  </div>

</html>
